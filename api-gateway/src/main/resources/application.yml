server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: profesores-service
          uri: http://localhost:8081
          predicates:
            - Path=/profesores/**

        - id: asignaturas-service
          uri: http://localhost:8082
          predicates:
            - Path=/asignaturas/**

        - id: cursos-service
          uri: http://localhost:8083
          predicates:
            - Path=/cursos/**
            
        - id: historial-service
          uri: http://localhost:8084
          predicates:
            - Path=/historial/**

        - id: impresiones-service
          uri: http://localhost:8085
          predicates:
            - Path=/impresiones/**

        - id: inventario-service
          uri: http://localhost:8086
          predicates:
            - Path=/inventario/**

        - id: cola-service
          uri: http://localhost:8087
          predicates:
            - Path=/cola/**

        - id: calidad-service
          uri: http://localhost:8088
          predicates:
            - Path=/calidad/**
        - id: retiros-service
          uri: http://localhost:8089
          predicates:
            - Path=/retiros/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Profesores
        url: /profesores/v3/api-docs
      - name: Asignaturas
        url: /asignaturas/v3/api-docs
      - name: Cursos
        url: /cursos/v3/api-docs
      - name: Historial
        url: /historial/v3/api-docs
      - name: Impresiones
        url: /impresiones/v3/api-docs
      - name: Inventario
        url: /inventario/v3/api-docs
      - name: Cola
        url: /cola/v3/api-docs
      - name: Calidad
        url: /calidad/v3/api-docs
      - name: Retiros
        url: /retiros/v3/api-docs